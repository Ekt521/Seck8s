server:
  port: 8086

spring:
  application:
    name: payment-service
  config:
    import: classpath:common-infra.yml

infra:
  mysql:
    schema: seck8s_payment_db

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

seck8s:
  pay:
    simulate-success-rate: 100       # 模拟支付成功率(%)
    simulate-delay-seconds: 3        # 模拟渠道处理延迟(秒)
