# =====================================================================
# 基础设施共享配置：所有服务通过 application.yml 里的
#   spring.config.import: classpath:common-infra.yml
# 导入本文件。修改 MySQL/Redis/RabbitMQ/Nacos 地址账号只需改这一处。
#
# 注意：spring.config.import 的优先级高于导入方 application.yml，
# 所以这里【不能】给 infra.mysql.schema 设默认值，否则会覆盖各服务
# 自己指定的库名（如 seck8s_user_db）。schema 必须由每个服务定义。
# =====================================================================
infra:
  mysql:
    host: 127.0.0.1
    port: 3306
    username: root
    password: ${SECK8S_MYSQL_PASSWORD}
    # schema 由各服务 application.yml 自行指定（seck8s_user_db 等）
  redis:
    host: 10.163.55.111        # Redis 服务器 IP
    port: 6379
    password: ${SECK8S_REDIS_PASSWORD}        # Redis 密码
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: ${SECK8S_RABBITMQ_PASSWORD}
  nacos:
    server-addr: 127.0.0.1:8848

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${infra.mysql.host}:${infra.mysql.port}/${infra.mysql.schema}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${infra.mysql.username}
    password: ${infra.mysql.password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
      connection-timeout: 30000
  data:
    redis:
      host: ${infra.redis.host}
      port: ${infra.redis.port}
      password: ${infra.redis.password:}
      timeout: 5s
      lettuce:
        pool:
          max-active: 128        # 秒杀热点需较大连接池
          max-idle: 16
          min-idle: 4
  rabbitmq:
    host: ${infra.rabbitmq.host}
    port: ${infra.rabbitmq.port}
    username: ${infra.rabbitmq.username}
    password: ${infra.rabbitmq.password}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual   # 消费手动确认，失败重试
        prefetch: 10
  cloud:
    nacos:
      discovery:
        server-addr: ${infra.nacos.server-addr}

seck8s:
  jwt:
    # 所有服务共用同一个签名密钥（网关校验、user-service 签发）
    # 真实值由环境变量 SECK8S_JWT_SECRET 提供，不要写回本文件
    secret: ${SECK8S_JWT_SECRET}
